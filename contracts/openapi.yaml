        name:
          type: "string"
          minLength: 1
          maxLength: 120
        description:
          type: "string"
          minLength: 0
          maxLength: 2000
        imageUrl:
          type: "string"
          minLength: 1
          maxLength: 2048
          format: "uri"
          pattern: "^https://"
          description: "An absolute HTTPS URL without embedded credentials. The backend never fetches this URL."
        price:
          type: "integer"
          minimum: 1
          maximum: 1000000000000
          description: "Unit price in Iranian rial (IRR), as an integer."
        stock:
          type: "integer"
          minimum: 0
          maximum: 1000000000
        active:
          type: "boolean"
          description: "False archives the product from public browsing and new purchases; order history remains."
        version:
          type: "integer"
          minimum: 0
          description: "The version from the most recently read product; stale writes return 409. Orders and cancellation also increment it."
    ShopProduct:
      type: "object"
      additionalProperties: false
