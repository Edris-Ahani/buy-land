components:
  headers:
    NoStore:
      description: Authentication responses must not be cached.
      required: true
      schema: { type: string, const: no-store }
    RequestId:
      description: A UUID generated by the server for this request. Client-provided identifiers are not trusted.
      required: true
      schema: { type: string, format: uuid }
      example: 06a64cb2-dcf2-4f69-a3cb-34254ef2c9a1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the accessToken returned by registration, login, or refresh. Catalog writes additionally require catalog:write.
  parameters:
    ShopPage:
      name: "page"
      in: "query"
      description: "Zero-based page; rows are ordered by createdAt DESC, id DESC."
      schema:
        type: "integer"
        minimum: 0
        maximum: 10000
        default: 0
    ShopSize:
      name: "size"
      in: "query"
      description: "Maximum returned rows."
      schema:
        type: "integer"
        minimum: 1
        maximum: 50
        default: 12
    ShopId:
      name: "id"
      in: "path"
      required: true
      description: "Resource UUID."
      schema:
        type: "string"
        format: "uuid"
    ShopCategoryFilter:
      name: "categoryId"
      in: "query"
      description: "Filter by category UUID; unknown categories yield an empty page."
      schema:
        type: "string"
        format: "uuid"
    ShopSearch:
      name: "q"
      in: "query"
      description: "Trimmed, case-insensitive literal substring of product name or SKU; percent and underscore are literal characters."
      schema:
        type: "string"
        minLength: 0
        maxLength: 100
        default: ""
    ShopStatus:
      name: "status"
      in: "query"
      description: "Filter by exact order status."
      schema:
        type: "string"
        enum: ["pending","confirmed","shipped","cancelled"]
    ShopUserFilter:
      name: "userId"
      in: "query"
      description: "Optional account UUID filter, available only to administrators."
      schema:
        type: "string"
        format: "uuid"
  schemas:
    ShopCategoryInput:
      type: "object"
      required: ["name","slug"]
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        slug:
          type: "string"
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    ShopCategory:
      type: "object"
      additionalProperties: false
      required: ["id","name","slug","createdAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        slug:
          type: "string"
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        createdAt:
          type: "string"
          format: "date-time"
    ShopCategoryPage:
      type: "object"
      additionalProperties: false
      required: ["items","page","size","totalElements","totalPages"]
