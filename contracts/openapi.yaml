      properties:
        productId:
          type: "string"
          format: "uuid"
        quantity:
          type: "integer"
          minimum: 1
          maximum: 100
    ShopOrderInput:
      type: "object"
      required: ["requestId","address","items"]
      properties:
        requestId:
          type: "string"
          format: "uuid"
          description: "Generate one UUID per intended purchase. Retry the same normalized address and item quantities with the same UUID to obtain the existing order without another stock deduction. Reusing it with different input returns 409."
        address:
          "$ref": "#/components/schemas/ShopAddressInput"
        items:
          type: "array"
          minItems: 1
          maxItems: 50
          items:
            "$ref": "#/components/schemas/ShopOrderItemInput"
          description: "Each product appears once. Submitted prices, totals, user IDs, and statuses are ignored; the server is authoritative."
    ShopOrderLine:
      type: "object"
      additionalProperties: false
      required: ["productId","sku","name","unitPrice","quantity","lineTotal"]
      properties:
        productId:
          type: "string"
          format: "uuid"
        sku:
          type: "string"
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
        name:
          type: "string"
          minLength: 1
          maxLength: 120
        unitPrice:
          type: "integer"
