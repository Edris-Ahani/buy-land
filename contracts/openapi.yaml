openapi: 3.1.0
info:
  title: Buy Land Catalog API
  version: 1.0.0
  description: |
    Phone and password authentication with rotating refresh tokens, and a public catalog.

    API paths are versioned under `/api/v1`. Responses use explicit resource DTOs;
    collection responses use bounded, zero-based pagination. Timestamps are UTC.

    Errors follow RFC 9457 (`application/problem+json`). Every API response includes
    a server-generated `X-Request-ID`; errors repeat it as `requestId` for support.

    Use Authorize to paste a short-lived bearer token. Tokens must have the configured
    issuer, the configured API audience, and the scope required by the operation.
    Register or log in to obtain an access token. New users receive no catalog write scope.

    Before serving requests, the API checks its fixed-ID startup administrator. A missing
    administrator is created from private runtime configuration; an existing one is left
    unchanged. This account uses the same phone/password login and rotating token lifecycle.
    Public registration accepts only user accounts and cannot assign administrator roles.

    Browser access from another origin requires an exact entry in CORS_ALLOWED_ORIGINS.
    The local setup includes localhost and 127.0.0.1 on ports 3000 and 5173. Browser
    clients send JSON and an Authorization bearer header with credentials omitted;
    cookies do not authenticate requests. Allowed API preflights support GET, POST, PUT,
    Authorization, Content-Type, and Accept. X-Request-ID is exposed to browser code.
    Other origins, methods, or headers are rejected with 403 by the CORS layer before
    the application; those rejections do not use the application problem schema.
servers:
  - url: /
    description: The same origin as this API reference
tags:
  - name: Authentication
    description: Account registration, phone-based login, refresh rotation, and session revocation.
  - name: Catalog
    description: Public catalog reads and scoped catalog creation.
  - name: Categories
    description: Public category browsing.
  - name: Products
    description: Public physical product browsing in IRR.
  - name: Orders
    description: Customer-owned orders and cancellation.
  - name: Administration
    description: Administrator-only merchandise and order management.
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a user and start a session
      description: |
        Requires a full name containing given and family names, an Iranian mobile number,
        and a password of 8-128 characters. Local and international phone formats and
        Persian or Arabic digits normalize to the same unique +98 username.
        Registration does not verify ownership of the phone number or grant catalog write access.
        The optional type enum accepts only the exact string user and defaults to user when
        omitted. admin, unknown strings, numbers, and explicit null return 400; public
        registration cannot create administrators. Responses include the stored user type.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterUser' }
            example: { fullName: Edris Ahani, phoneNumber: '09120000001', password: ExamplePassword42!, type: user }
      responses:
        '201': { $ref: '#/components/responses/Registered' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409':
          description: This normalized phone number is already registered
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Log in using a phone number and password
      description: Creates an independent session for a user or administrator, including the startup-seeded administrator. The stored account determines user.type and the JWT type claim; clients cannot select a role during login. Incorrect credentials and disabled accounts return the same generic error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginUser' }
            example: { phoneNumber: '09120000001', password: ExamplePassword42! }
      responses:
        '200': { $ref: '#/components/responses/Authenticated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Exchange a refresh token for a new token pair
      description: |
        Each refresh token is single-use. Store the replacement pair atomically and serialize
        refresh requests in the client. Reusing a consumed token revokes its entire session,
        including all access and replacement refresh tokens. Session expiry is absolute
        (30 days by default); refreshing does not extend it. Expired, revoked, malformed,
        or unknown tokens return 401. Access tokens normally expire after 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshSession' }
      responses:
        '200': { $ref: '#/components/responses/Authenticated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutSession
      summary: Revoke the session identified by a refresh token
      description: |
        Possession of the refresh token authorizes revocation; an access token is unnecessary.
        Revokes both access and refresh tokens for that session. Repeated logout or an unknown,
        well-formed token returns 204. A previously consumed token can also revoke its session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshSession' }
      responses:
        '204': { $ref: '#/components/responses/LoggedOut' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAllSessions
      summary: Revoke all current sessions of the authenticated user
      description: Requires a valid access token. Also revokes the access token used for this request.
      responses:
        '204': { $ref: '#/components/responses/LoggedOut' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Read the authenticated user profile
      description: Requires an access token for an enabled account and an active, unexpired session.
      responses:
        '200':
          description: The current user without credentials
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/catalog:
    get:
      tags: [Catalog]
      operationId: listCatalog
      summary: List public catalog items, newest first with an identifier tie-breaker
      description: Returns a zero-based page ordered by createdAt descending, then id descending. Reading is public.
      security: []
      parameters:
        - name: page
          in: query
          description: Zero-based page number, up to 10000.
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
          example: 0
        - name: size
          in: query
          description: Maximum number of items per page, up to 50.
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
          example: 12
      responses:
        '200':
          description: A bounded catalog page
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPage' }
              examples:
                emptyPage:
                  summary: An empty first page
                  value: { items: [], page: 0, size: 12, totalElements: 0, totalPages: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Catalog]
      operationId: createCatalogItem
      summary: Create a public catalog item
      description: Requires a signed token with the configured issuer, API audience, active session, and catalog:write scope. Self-registered users do not receive this scope.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCatalogItem' }
            examples:
              starter:
                summary: A new catalog item with a unique slug
                value:
                  slug: spring-platform
                  name: Spring Platform
                  description: A modular platform starter
      responses:
        '201':
          description: The created catalog item
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
              examples:
                createdItem:
                  summary: The persisted resource
                  value:
                    id: 8e756936-6419-4b0e-9c44-5b5ce3fa4627
                    slug: spring-platform
                    name: Spring Platform
                    description: A modular platform starter
                    createdAt: '2026-11-12T10:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/ServerError' }
  "/api/v1/categories":
    get:
      tags: ["Categories"]
      operationId: "listShopCategories"
      summary: "List product categories"
      description: "Public; an invalid supplied bearer token is still rejected. Categories are ordered newest first."
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/ShopPage"
        -
          "$ref": "#/components/parameters/ShopSize"
      responses:
        200:
          description: "The requested resource or page"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopCategoryPage"
              example:
                items:
                  -
                    id: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                    name: "Office supplies"
                    slug: "office-supplies"
                    createdAt: "2026-11-18T10:00:00Z"
                page: 0
                size: 12
                totalElements: 1
                totalPages: 1
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        500:
          "$ref": "#/components/responses/ServerError"
  "/api/v1/products":
    get:
      tags: ["Products"]
      operationId: "listShopProducts"
      summary: "Browse active physical products"
      description: "Public; an invalid supplied bearer token is still rejected. Only active products appear; zero-stock products remain visible. All amounts are integer IRR."
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/ShopCategoryFilter"
        -
          "$ref": "#/components/parameters/ShopSearch"
        -
          "$ref": "#/components/parameters/ShopPage"
        -
          "$ref": "#/components/parameters/ShopSize"
      responses:
        200:
          description: "The requested resource or page"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopProductPage"
              example:
                items:
                  -
                    id: "07152668-3295-4c67-ad61-d86198219571"
                    categoryId: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                    sku: "NOTEBOOK-01"
                    name: "Notebook"
                    description: "A physical paper notebook"
                    imageUrl: "https://images.example.com/notebook.jpg"
                    price: 250000
                    stock: 20
                    active: true
                    currency: "IRR"
                    version: 0
                    createdAt: "2026-11-18T10:00:00Z"
                    updatedAt: "2026-11-18T10:00:00Z"
                page: 0
                size: 12
                totalElements: 1
                totalPages: 1
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        500:
          "$ref": "#/components/responses/ServerError"
  "/api/v1/products/{id}":
    get:
      tags: ["Products"]
      operationId: "getShopProduct"
      summary: "Read an active product"
      description: "Public; an invalid supplied bearer token is still rejected. Inactive or missing products return 404."
      security: []
      parameters:
        -
          "$ref": "#/components/parameters/ShopId"
      responses:
        200:
          description: "The requested resource or page"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopProduct"
              example:
                id: "07152668-3295-4c67-ad61-d86198219571"
                categoryId: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                sku: "NOTEBOOK-01"
                name: "Notebook"
                description: "A physical paper notebook"
                imageUrl: "https://images.example.com/notebook.jpg"
                price: 250000
                stock: 20
                active: true
                currency: "IRR"
                version: 0
                createdAt: "2026-11-18T10:00:00Z"
                updatedAt: "2026-11-18T10:00:00Z"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        404:
          "$ref": "#/components/responses/ShopNotFound"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        500:
          "$ref": "#/components/responses/ServerError"
  "/api/v1/admin/categories":
    post:
      tags: ["Administration"]
      operationId: "createShopCategory"
      summary: "Create a category"
      description: "Requires the admin role in a valid access JWT. Slugs are unique and case-sensitive lowercase words. Use the returned id for products."
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ShopCategoryInput"
            example:
              name: "Office supplies"
              slug: "office-supplies"
      responses:
        201:
          description: "Resource created, or the existing order for the same requestId"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopCategory"
              example:
                id: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                name: "Office supplies"
                slug: "office-supplies"
                createdAt: "2026-11-18T10:00:00Z"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        409:
          "$ref": "#/components/responses/ShopConflict"
        415:
          "$ref": "#/components/responses/UnsupportedMediaType"
        500:
          "$ref": "#/components/responses/ServerError"
  "/api/v1/admin/categories/{id}":
    put:
      tags: ["Administration"]
      operationId: "updateShopCategory"
      summary: "Replace category details"
      description: "Requires the admin role in a valid access JWT. Products keep the same category identifier; duplicate slugs return 409."
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/ShopId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ShopCategoryInput"
            example:
              name: "Office supplies"
              slug: "office-supplies"
      responses:
        200:
          description: "The requested resource or page"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopCategory"
              example:
                id: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                name: "Office supplies"
                slug: "office-supplies"
                createdAt: "2026-11-18T10:00:00Z"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/ShopNotFound"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        409:
          "$ref": "#/components/responses/ShopConflict"
        415:
          "$ref": "#/components/responses/UnsupportedMediaType"
        500:
          "$ref": "#/components/responses/ServerError"
  "/api/v1/admin/products":
    get:
      tags: ["Administration"]
      operationId: "listAdminShopProducts"
      summary: "List active and inactive products"
      description: "Requires the admin role in a valid access JWT. Supports the same filters as the public product list."
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/ShopCategoryFilter"
        -
          "$ref": "#/components/parameters/ShopSearch"
        -
          "$ref": "#/components/parameters/ShopPage"
        -
          "$ref": "#/components/parameters/ShopSize"
      responses:
        200:
          description: "The requested resource or page"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopProductPage"
              example:
                items:
                  -
                    id: "07152668-3295-4c67-ad61-d86198219571"
                    categoryId: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                    sku: "NOTEBOOK-01"
                    name: "Notebook"
                    description: "A physical paper notebook"
                    imageUrl: "https://images.example.com/notebook.jpg"
                    price: 250000
                    stock: 20
                    active: true
                    currency: "IRR"
                    version: 0
                    createdAt: "2026-11-18T10:00:00Z"
                    updatedAt: "2026-11-18T10:00:00Z"
                page: 0
                size: 12
                totalElements: 1
                totalPages: 1
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        500:
          "$ref": "#/components/responses/ServerError"
    post:
      tags: ["Administration"]
      operationId: "createShopProduct"
      summary: "Create a physical product"
      description: "Requires the admin role in a valid access JWT. One price and one stock balance per product. SKU is globally unique and case-sensitive. Use an existing category id. Extra request fields are ignored."
      security:
        -
          bearerAuth: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ShopProductInput"
            example:
              categoryId: "b90ce17a-8bf1-42df-b032-3285c96b7261"
              sku: "NOTEBOOK-01"
              name: "Notebook"
              description: "A physical paper notebook"
              imageUrl: "https://images.example.com/notebook.jpg"
              price: 250000
              stock: 20
              active: true
      responses:
        201:
          description: "Resource created, or the existing order for the same requestId"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopProduct"
              example:
                id: "07152668-3295-4c67-ad61-d86198219571"
                categoryId: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                sku: "NOTEBOOK-01"
                name: "Notebook"
                description: "A physical paper notebook"
                imageUrl: "https://images.example.com/notebook.jpg"
                price: 250000
                stock: 20
                active: true
                currency: "IRR"
                version: 0
                createdAt: "2026-11-18T10:00:00Z"
                updatedAt: "2026-11-18T10:00:00Z"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/ShopNotFound"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        409:
          "$ref": "#/components/responses/ShopConflict"
        415:
          "$ref": "#/components/responses/UnsupportedMediaType"
        500:
          "$ref": "#/components/responses/ServerError"
  "/api/v1/admin/products/{id}":
    get:
      tags: ["Administration"]
      operationId: "getAdminShopProduct"
      summary: "Read a product for editing"
      description: "Requires the admin role in a valid access JWT. Includes inactive products and the current version."
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/ShopId"
      responses:
        200:
          description: "The requested resource or page"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopProduct"
              example:
                id: "07152668-3295-4c67-ad61-d86198219571"
                categoryId: "b90ce17a-8bf1-42df-b032-3285c96b7261"
                sku: "NOTEBOOK-01"
                name: "Notebook"
                description: "A physical paper notebook"
                imageUrl: "https://images.example.com/notebook.jpg"
                price: 250000
                stock: 20
                active: true
                currency: "IRR"
                version: 0
                createdAt: "2026-11-18T10:00:00Z"
                updatedAt: "2026-11-18T10:00:00Z"
        400:
          "$ref": "#/components/responses/BadRequest"
        401:
          "$ref": "#/components/responses/Unauthorized"
        403:
          "$ref": "#/components/responses/Forbidden"
        404:
          "$ref": "#/components/responses/ShopNotFound"
        406:
          "$ref": "#/components/responses/NotAcceptable"
        500:
          "$ref": "#/components/responses/ServerError"
    put:
      tags: ["Administration"]
      operationId: "updateShopProduct"
      summary: "Replace product details and stock"
      description: "Requires the admin role in a valid access JWT. Supply every field and its current version. Stock is the new absolute balance. Purchases and cancellations also increment version, so a stale edit returns 409 instead of overwriting stock. Set active=false to archive; existing orders remain unchanged."
      security:
        -
          bearerAuth: []
      parameters:
        -
          "$ref": "#/components/parameters/ShopId"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ShopProductUpdate"
            example:
              categoryId: "b90ce17a-8bf1-42df-b032-3285c96b7261"
              sku: "NOTEBOOK-01"
              name: "Notebook"
              description: "A physical paper notebook"
              imageUrl: "https://images.example.com/notebook.jpg"
              price: 250000
              stock: 20
              active: true
              version: 0
      responses:
        200:
          description: "The requested resource or page"
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ShopProduct"
