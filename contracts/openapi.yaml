          type: "integer"
          minimum: 0
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    ShopProductPage:
      type: "object"
      additionalProperties: false
      required: ["items","page","size","totalElements","totalPages"]
      properties:
        items:
          type: "array"
          maxItems: 50
