          maxLength: 80
        trackingCode:
          type: ["string","null"]
          maxLength: 120
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
    ShopOrder:
      type: "object"
      additionalProperties: false
      required: ["id","userId","requestId","status","total","currency","carrier","trackingCode","createdAt","updatedAt","address","items"]
      properties:
        id:
          type: "string"
          format: "uuid"
        userId:
          type: "string"
          format: "uuid"
        requestId:
          type: "string"
          format: "uuid"
        status:
          type: "string"
          enum: ["pending","confirmed","shipped","cancelled"]
        total:
          type: "integer"
          minimum: 1
          maximum: 5000000000000000
        currency:
          type: "string"
          const: "IRR"
        carrier:
          type: ["string","null"]
          maxLength: 80
        trackingCode:
          type: ["string","null"]
          maxLength: 120
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"
        address:
          "$ref": "#/components/schemas/ShopAddress"
        items:
          type: "array"
          minItems: 1
          maxItems: 50
