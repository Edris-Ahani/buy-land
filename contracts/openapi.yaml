            "$ref": "#/components/schemas/ShopOrderLine"
    ShopOrderPage:
      type: "object"
      additionalProperties: false
      required: ["items","page","size","totalElements","totalPages"]
      properties:
        items:
          type: "array"
          maxItems: 50
          items:
            "$ref": "#/components/schemas/ShopOrderSummary"
        page:
          type: "integer"
