          maximum: 1000000000000
        quantity:
          type: "integer"
          minimum: 1
          maximum: 100
        lineTotal:
          type: "integer"
          minimum: 1
          maximum: 100000000000000
    ShopOrderSummary:
      type: "object"
      additionalProperties: false
      required: ["id","userId","requestId","status","total","currency","carrier","trackingCode","createdAt","updatedAt"]
      properties:
        id:
