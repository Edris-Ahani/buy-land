            "$ref": "#/components/schemas/ShopProduct"
        page:
          type: "integer"
          minimum: 0
          maximum: 10000
        size:
          type: "integer"
          minimum: 1
          maximum: 50
        totalElements:
          type: "integer"
          minimum: 0
        totalPages:
          type: "integer"
          minimum: 0
    ShopAddressInput:
      type: "object"
      required: ["recipientName","phoneNumber","province","city","addressLine","postalCode"]
      properties:
        recipientName:
          type: "string"
          minLength: 1
          maxLength: 160
        phoneNumber:
          type: "string"
          pattern: "^(09[0-9]{9}|\\+989[0-9]{9})$"
        province:
          type: "string"
          minLength: 1
          maxLength: 80
        city:
          type: "string"
          minLength: 1
          maxLength: 80
        addressLine:
          type: "string"
          minLength: 10
          maxLength: 500
        postalCode:
          type: "string"
          pattern: "^[0-9]{10}$"
    ShopAddress:
      type: "object"
      additionalProperties: false
      required: ["recipientName","phoneNumber","province","city","addressLine","postalCode"]
      properties:
        recipientName:
          type: "string"
          minLength: 1
          maxLength: 160
        phoneNumber:
          type: "string"
          pattern: "^\\+989[0-9]{9}$"
        province:
          type: "string"
          minLength: 1
          maxLength: 80
        city:
          type: "string"
          minLength: 1
          maxLength: 80
        addressLine:
          type: "string"
          minLength: 10
          maxLength: 500
        postalCode:
          type: "string"
          pattern: "^[0-9]{10}$"
    ShopOrderItemInput:
      type: "object"
